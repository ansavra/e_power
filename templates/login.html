<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចូលប្រើប្រាស់ប្រព័ន្ធ - E-POWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Siemreap&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ now.timestamp() }}">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="E-POWER Logo" class="auth-logo-img">
        <h1 class="auth-title">E-POWER</h1>
        <p class="auth-subtitle">ប្រព័ន្ធគ្រប់គ្រងការប្រើប្រាស់អគ្គិសនី</p>
      </div>

      <div class="auth-header">
        <h2>🔐 ចូលប្រើប្រាស់ប្រព័ន្ធ</h2>
        <p>សូមបញ្ចូលព័ត៌មានគណនីរបស់អ្នកដើម្បីបន្ត</p>
      </div>

      {% if error %}
      <div class="auth-alert danger">
        <span>⚠️</span>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="username">ឈ្មោះគណនី (Username)</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="input-text" placeholder="បញ្ចូលឈ្មោះគណនី..." required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">ពាក្យសម្ងាត់ (Password)</label>
          <div class="input-with-icon">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" name="password" class="input-text" placeholder="បញ្ចូលពាក្យសម្ងាត់..." required>
            <button type="button" class="btn-toggle-pw" onclick="togglePassword('password', this)" title="បង្ហាញ/លាក់ពាក្យសម្ងាត់">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth">
          <span>⚡</span> ចូលគណនី (Log In)
        </button>
      </form>

      <div class="auth-footer">
        <p>មិនទាន់មានគណនីមែនទេ? <a href="{{ url_for('register') }}" class="auth-link">ចុះឈ្មោះនៅទីនេះ</a></p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🔒';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>
</body>
</html>

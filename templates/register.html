<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចុះឈ្មោះគណនីថ្មី - E-POWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Siemreap&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ now.timestamp() }}">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="NGP Logo" class="auth-logo-img">
        <h1 class="auth-title">NGP E-POWER</h1>
        <p class="auth-subtitle">ប្រព័ន្ធគ្រប់គ្រងការប្រើប្រាស់អគ្គិសនី</p>
      </div>

      <div class="auth-header">
        <h2>📝 ចុះឈ្មោះគណនីថ្មី</h2>
        <p>សូមបំពេញព័ត៌មានខាងក្រោមដើម្បីបង្កើតគណនី</p>
      </div>

      {% if error %}
      <div class="auth-alert danger">
        <span>⚠️</span>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}" class="auth-form" onsubmit="return validateRegisterForm()">
        <div class="form-group">
          <label class="form-label" for="full_name">ឈ្មោះពេញ (Full Name)</label>
          <div class="input-with-icon">
            <span class="input-icon">🏷️</span>
            <input type="text" id="full_name" name="full_name" class="input-text" placeholder="ឧ. សុខ ចាន់ថន..." required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">ឈ្មោះគណនី (Username - អក្សរឡាតាំងតូច)</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="input-text" placeholder="ឧ. chanthorn..." required pattern="[a-zA-Z0-9_\-\.]{3,30}" title="ត្រូវមានពី 3 ទៅ 30 តួអក្សរ">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">ពាក្យសម្ងាត់ (Password)</label>
          <div class="input-with-icon">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" name="password" class="input-text" placeholder="យ៉ាងតិច ៤ តួអក្សរ..." required minlength="4">
            <button type="button" class="btn-toggle-pw" onclick="togglePassword('password', this)" title="បង្ហាញ/លាក់ពាក្យសម្ងាត់">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">ផ្ទៀងផ្ទាត់ពាក្យសម្ងាត់ (Confirm Password)</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirm_password" name="confirm_password" class="input-text" placeholder="បញ្ចូលពាក្យសម្ងាត់ម្តងទៀត..." required minlength="4">
            <button type="button" class="btn-toggle-pw" onclick="togglePassword('confirm_password', this)" title="បង្ហាញ/លាក់ពាក្យសម្ងាត់">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth">
          <span>📝</span> បង្កើតគណនី (Register)
        </button>
      </form>

      <div class="auth-footer">
        <p>មានគណនីរួចហើយមែនទេ? <a href="{{ url_for('login') }}" class="auth-link">ចូលគណនីនៅទីនេះ</a></p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🔒';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function validateRegisterForm() {
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('confirm_password').value;
      if (p1 !== p2) {
        alert('ពាក្យសម្ងាត់ទាំងពីរមិនដូចគ្នាទេ! សូមពិនិត្យឡើងវិញ។');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
